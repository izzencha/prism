<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>prism</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      user-select: none;
    }
    .glass {
      background: rgba(18, 18, 22, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-card {
      background: rgba(24, 24, 27, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex justify-center bg-black min-h-screen">

  <div class="w-full max-w-md min-h-screen bg-zinc-950 flex flex-col justify-between relative shadow-2xl overflow-hidden border-x border-zinc-800/50">

    <header class="sticky top-2 z-40 mx-3 glass rounded-2xl px-4 py-2.5 flex items-center justify-between shadow-lg">
      <div class="flex items-center space-x-2.5 cursor-pointer" onclick="switchTab('home')">
        <div class="w-7 h-7 bg-black rounded-lg flex items-center justify-center p-0.5 border border-zinc-800">
          <svg viewBox="0 0 100 100" class="w-full h-full fill-white">
            <circle cx="58" cy="42" r="38" />
            <rect x="12" y="54" width="36" height="36" />
          </svg>
        </div>
        <span class="text-lg font-extrabold tracking-tight text-white">prism</span>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="switchTab('messenger')" class="relative p-2 rounded-xl hover:bg-zinc-800/60 transition active:scale-95">
          <i data-lucide="message-square" class="w-5 h-5 text-zinc-200"></i>
          <span id="unread-dot" class="hidden absolute top-1.5 right-1.5 w-2 h-2 bg-emerald-500 rounded-full"></span>
        </button>
      </div>
    </header>

    <main id="main-content" class="flex-1 overflow-y-auto pt-3 pb-24 hide-scrollbar px-3">
    </main>

    <div id="create-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
      <div class="glass-card w-full max-w-sm rounded-2xl p-4 space-y-4">
        <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
          <h3 class="text-sm font-bold text-white">Create Post</h3>
          <button onclick="closeModal()" class="p-1 rounded-lg hover:bg-zinc-800 text-zinc-400"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <textarea id="post-content-input" placeholder="What's on your mind?" class="w-full h-24 bg-zinc-900/90 rounded-xl p-3 text-xs text-white placeholder-zinc-500 focus:outline-none border border-zinc-800 resize-none"></textarea>
        <input id="post-media-input" type="url" placeholder="Optional Image/Video URL" class="w-full bg-zinc-900/90 text-xs text-white placeholder-zinc-500 rounded-xl p-2.5 border border-zinc-800 focus:outline-none" />
        <div class="flex justify-between items-center pt-1">
          <select id="post-type-select" class="bg-zinc-900 text-xs text-zinc-300 rounded-xl p-2 border border-zinc-800 focus:outline-none">
            <option value="threads">Threads (Text)</option>
            <option value="photo">Instagram (Photo)</option>
            <option value="reel">TikTok (Reel)</option>
          </select>
          <button onclick="publishPost()" class="bg-white text-black font-bold text-xs px-5 py-2 rounded-xl active:scale-95 transition">Post</button>
        </div>
      </div>
    </div>

    <div id="edit-profile-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
      <div class="glass-card w-full max-w-sm rounded-2xl p-4 space-y-4">
        <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
          <h3 class="text-sm font-bold text-white">Edit Profile</h3>
          <button onclick="closeEditProfile()"><i data-lucide="x" class="w-4 h-4 text-zinc-400"></i></button>
        </div>
        <div class="space-y-3 text-xs">
          <div><label class="block text-zinc-400 mb-1">Display Name</label><input id="edit-name" type="text" class="w-full bg-zinc-900 text-white rounded-xl p-2.5 border border-zinc-800 focus:outline-none" /></div>
          <div><label class="block text-zinc-400 mb-1">Username Handle</label><input id="edit-handle" type="text" class="w-full bg-zinc-900 text-white rounded-xl p-2.5 border border-zinc-800 focus:outline-none" /></div>
          <div><label class="block text-zinc-400 mb-1">Avatar Image URL</label><input id="edit-avatar" type="url" class="w-full bg-zinc-900 text-white rounded-xl p-2.5 border border-zinc-800 focus:outline-none" /></div>
          <div><label class="block text-zinc-400 mb-1">Bio</label><textarea id="edit-bio" class="w-full h-16 bg-zinc-900 text-white rounded-xl p-2.5 border border-zinc-800 focus:outline-none resize-none"></textarea></div>
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button onclick="closeEditProfile()" class="px-4 py-2 rounded-xl text-xs text-zinc-400 hover:bg-zinc-800">Cancel</button>
          <button onclick="saveProfile()" class="bg-white text-black font-bold text-xs px-5 py-2 rounded-xl active:scale-95 transition">Save</button>
        </div>
      </div>
    </div>

    <nav class="fixed bottom-3 left-1/2 -translate-x-1/2 w-[calc(100%-24px)] max-w-[424px] glass rounded-2xl py-2.5 px-6 flex justify-between items-center z-40 shadow-xl border border-zinc-800/80">
      <button onclick="switchTab('home')" id="nav-home" class="nav-btn text-white active:scale-90 transition"><i data-lucide="home" class="w-5 h-5"></i></button>
      <button onclick="switchTab('reels')" id="nav-reels" class="nav-btn text-zinc-500 active:scale-90 transition"><i data-lucide="clapperboard" class="w-5 h-5"></i></button>
      <button onclick="openModal()" class="w-9 h-9 rounded-full bg-white text-black flex items-center justify-center shadow-lg active:scale-95 transition"><i data-lucide="plus" class="w-5 h-5"></i></button>
      <button onclick="switchTab('messenger')" id="nav-messenger" class="nav-btn text-zinc-500 active:scale-90 transition"><i data-lucide="send" class="w-5 h-5"></i></button>
      <button onclick="switchTab('profile')" id="nav-profile" class="nav-btn text-zinc-500 active:scale-90 transition"><i data-lucide="user" class="w-5 h-5"></i></button>
    </nav>

  </div>

  <script>
    let currentTab = 'home';
    let feedFilter = 'all';
    let activeChatId = null;

    const verifiedBadgeSVG = `
      <svg viewBox="0 0 100 100" class="w-4 h-4 inline-block ml-1">
        <circle cx="58" cy="42" r="38" fill="white" />
        <path d="M15 55 L38 78 L85 30" fill="none" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    `;

    let userProfile = JSON.parse(localStorage.getItem('prism_user')) || {
      name: 'Alex Scandinavian',
      handle: '@alex_nordic',
      avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200',
      bio: 'Designer & Developer. Building minimal glassmorphic digital ecosystems.',
      followers: 1840,
      following: 312,
      verified: true
    };

    let posts = JSON.parse(localStorage.getItem('prism_posts')) || [];

    if (posts.length === 0) {
      posts = [
        {
          id: 1,
          author: userProfile.name,
          handle: userProfile.handle,
          avatar: userProfile.avatar,
          type: 'photo',
          content: 'First post on prism. Clean Scandinavian industrial aesthetics.',
          media: 'https://images.unsplash.com/photo-1507089947368-19c1da9775ae?w=800',
          time: '15m',
          likes: 42,
          comments: [{ author: 'Sarah Chen', text: 'This design looks incredible!' }],
          liked: false,
          verified: true
        },
        {
          id: 2,
          author: 'DPZ Studio',
          handle: '@dpz_official',
          avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100',
          type: 'threads',
          content: 'Simplicity is not about removing details, but focusing on what truly matters.',
          media: null,
          time: '1h',
          likes: 128,
          comments: [],
          liked: true,
          verified: false
        }
      ];
      localStorage.setItem('prism_posts', JSON.stringify(posts));
    }

    let chatList = JSON.parse(localStorage.getItem('prism_chats')) || [
      {
        id: 1,
        name: 'Sarah Chen',
        avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100',
        online: true,
        messages: [
          { sender: 'them', text: 'Hey Alex, did you push the new glass layout?' },
          { sender: 'me', text: 'Yes, just live on GitHub!' }
        ]
      },
      {
        id: 2,
        name: 'Marcus Vance',
        avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100',
        online: false,
        messages: [{ sender: 'them', text: 'Love the dark mode contrast.' }]
      }
    ];

    function saveState() {
      localStorage.setItem('prism_posts', JSON.stringify(posts));
      localStorage.setItem('prism_user', JSON.stringify(userProfile));
      localStorage.setItem('prism_chats', JSON.stringify(chatList));
    }

    function switchTab(tab) {
      currentTab = tab;
      activeChatId = null;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.className = 'nav-btn text-zinc-500 transition');
      const activeNav = document.getElementById('nav-' + tab);
      if (activeNav) activeNav.className = 'nav-btn text-white transition';
      render();
    }

    function setFilter(filter) {
      feedFilter = filter;
      render();
    }

    function toggleLike(id) {
      const post = posts.find(p => p.id === id);
      if (post) {
        post.liked = !post.liked;
        post.likes += post.liked ? 1 : -1;
        saveState();
        render();
      }
    }

    function addComment(postId) {
      const input = document.getElementById(`comment-input-${postId}`);
      if (!input || !input.value.trim()) return;
      const post = posts.find(p => p.id === postId);
      if (post) {
        post.comments.push({ author: userProfile.name, text: input.value.trim() });
        saveState();
        render();
      }
    }

    function openModal() { document.getElementById('create-modal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('create-modal').classList.add('hidden'); }

    function publishPost() {
      const content = document.getElementById('post-content-input').value.trim();
      const media = document.getElementById('post-media-input').value.trim();
      const type = document.getElementById('post-type-select').value;
      if (!content) return;

      posts.unshift({
        id: Date.now(),
        author: userProfile.name,
        handle: userProfile.handle,
        avatar: userProfile.avatar,
        type: type,
        content: content,
        media: media || (type === 'photo' ? 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800' : null),
        time: 'Just now',
        likes: 0,
        comments: [],
        liked: false,
        verified: userProfile.verified
      });

      saveState();
      document.getElementById('post-content-input').value = '';
      document.getElementById('post-media-input').value = '';
      closeModal();
      switchTab('home');
    }

    function openEditProfile() {
      document.getElementById('edit-name').value = userProfile.name;
      document.getElementById('edit-handle').value = userProfile.handle;
      document.getElementById('edit-avatar').value = userProfile.avatar;
      document.getElementById('edit-bio').value = userProfile.bio;
      document.getElementById('edit-profile-modal').classList.remove('hidden');
    }

    function closeEditProfile() { document.getElementById('edit-profile-modal').classList.add('hidden'); }

    function saveProfile() {
      userProfile.name = document.getElementById('edit-name').value.trim() || userProfile.name;
      userProfile.handle = document.getElementById('edit-handle').value.trim() || userProfile.handle;
      userProfile.avatar = document.getElementById('edit-avatar').value.trim() || userProfile.avatar;
      userProfile.bio = document.getElementById('edit-bio').value.trim() || userProfile.bio;
      saveState();
      closeEditProfile();
      render();
    }

    function openChat(chatId) { activeChatId = chatId; render(); }

    function sendChatMessage() {
      const input = document.getElementById('chat-msg-input');
      if (!input || !input.value.trim() || !activeChatId) return;
      const chat = chatList.find(c => c.id === activeChatId);
      if (chat) {
        chat.messages.push({ sender: 'me', text: input.value.trim() });
        saveState();
        render();
        setTimeout(() => {
          chat.messages.push({ sender: 'them', text: 'Received!' });
          saveState();
          if (activeChatId === chat.id) render();
        }, 1000);
      }
    }

    function renderFeed() {
      let filtered = posts;
      if (feedFilter === 'threads') filtered = posts.filter(p => p.type === 'threads');
      if (feedFilter === 'reels') filtered = posts.filter(p => p.type === 'reel' || p.type === 'photo');

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-around pb-2 border-b border-zinc-800/60 text-xs font-semibold text-zinc-400">
            <button onclick="setFilter('all')" class="${feedFilter === 'all' ? 'text-white border-b-2 border-white pb-1' : 'pb-1'}">For You</button>
            <button onclick="setFilter('threads')" class="${feedFilter === 'threads' ? 'text-white border-b-2 border-white pb-1' : 'pb-1'}">Threads</button>
            <button onclick="setFilter('reels')" class="${feedFilter === 'reels' ? 'text-white border-b-2 border-white pb-1' : 'pb-1'}">Reels</button>
          </div>
          <div class="space-y-3">
            ${filtered.map(post => `
              <div class="glass-card rounded-2xl p-4 space-y-3">
                <div class="flex items-center justify-between">
                  <div class="flex items-center space-x-3">
                    <img src="${post.avatar}" class="w-9 h-9 rounded-full object-cover border border-zinc-700" />
                    <div>
                      <div class="flex items-center space-x-1">
                        <h4 class="text-sm font-semibold text-zinc-100">${post.author}</h4>
                        ${post.verified ? verifiedBadgeSVG : ''}
                      </div>
                      <p class="text-xs text-zinc-500">${post.handle} • ${post.time}</p>
                    </div>
                  </div>
                  <span class="text-[10px] px-2 py-0.5 rounded-full bg-zinc-800 text-zinc-400 border border-zinc-700/50 uppercase font-mono tracking-wider">${post.type}</span>
                </div>
                <p class="text-sm text-zinc-200 leading-relaxed">${post.content}</p>
                ${post.media ? `<div class="relative rounded-xl overflow-hidden border border-zinc-800 bg-zinc-900"><img src="${post.media}" class="w-full h-60 object-cover" /></div>` : ''}
                <div class="flex items-center justify-between pt-2 text-zinc-400 text-xs border-b border-zinc-800/40 pb-2">
                  <div class="flex items-center space-x-4">
                    <button onclick="toggleLike(${post.id})" class="flex items-center space-x-1 hover:text-rose-500 transition">
                      <i data-lucide="heart" class="w-4 h-4 ${post.liked ? 'text-rose-500 fill-rose-500' : ''}"></i>
                      <span>${post.likes}</span>
                    </button>
                    <div class="flex items-center space-x-1"><i data-lucide="message-circle" class="w-4 h-4"></i><span>${post.comments.length}</span></div>
                  </div>
                  <i data-lucide="bookmark" class="w-4 h-4"></i>
                </div>
                <div class="space-y-2 pt-1">
                  ${post.comments.map(c => `<div class="text-xs bg-zinc-900/50 rounded-lg p-2"><span class="font-bold text-zinc-200">${c.author}:</span><span class="text-zinc-400 ml-1">${c.text}</span></div>`).join('')}
                  <div class="flex space-x-2 pt-1">
                    <input id="comment-input-${post.id}" type="text" placeholder="Write a comment..." class="flex-1 bg-zinc-900 text-xs text-white rounded-xl px-3 py-1.5 border border-zinc-800 focus:outline-none" />
                    <button onclick="addComment(${post.id})" class="bg-zinc-800 text-xs text-white px-3 py-1.5 rounded-xl font-semibold">Reply</button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderReels() {
      return `
        <div class="relative h-[calc(100vh-170px)] bg-zinc-900 rounded-2xl overflow-hidden border border-zinc-800 flex items-end p-4">
          <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800" class="absolute inset-0 w-full h-full object-cover" />
          <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
          <div class="relative z-10 w

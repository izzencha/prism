
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>prism</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js CDN (For mobile interactive state without heavy frameworks) -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Custom scrollbar & glassmorphic aesthetics */
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .glass {
      background: rgba(24, 24, 27, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(24, 24, 27, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex justify-center bg-black min-h-screen">

  <!-- Mobile Container Wrapper -->
  <div x-data="prismApp()" class="w-full max-w-md min-h-screen bg-zinc-950 flex flex-col justify-between relative shadow-2xl overflow-hidden border-x border-zinc-800/50">

    <!-- TOP HEADER (Dynamic based on tab) -->
    <header class="sticky top-0 z-40 glass px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <!-- prism logo badge -->
        <div class="w-7 h-7 bg-white rounded-md flex items-center justify-center p-1 shadow-sm">
          <div class="w-full h-full bg-black rounded-full flex items-center justify-end p-0.5">
            <div class="w-2.5 h-2.5 bg-white rounded-sm"></div>
          </div>
        </div>
        <span class="text-xl font-bold tracking-tight text-white">prism</span>
      </div>

      <div class="flex items-center space-x-3">
        <button @click="currentTab = 'messenger'" class="relative p-1.5 rounded-full hover:bg-zinc-800/60 transition">
          <i data-lucide="message-square" class="w-5 h-5 text-zinc-200"></i>
          <span class="absolute top-1 right-1 w-2 h-2 bg-emerald-500 rounded-full"></span>
        </button>
      </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 overflow-y-auto pb-20 hide-scrollbar">

      <!-- ================= HOME FEED (Instagram / Threads / Reels Filter) ================= -->
      <template x-if="currentTab === 'home'">
        <div class="space-y-4">
          
          <!-- Filter Tabs -->
          <div class="flex items-center justify-around px-4 pt-3 pb-1 border-b border-zinc-800/40 text-xs font-semibold text-zinc-400">
            <button @click="feedFilter = 'all'" :class="feedFilter === 'all' ? 'text-white border-b-2 border-white pb-2' : 'pb-2'">For You</button>
            <button @click="feedFilter = 'threads'" :class="feedFilter === 'threads' ? 'text-white border-b-2 border-white pb-2' : 'pb-2'">Threads</button>
            <button @click="feedFilter = 'reels'" :class="feedFilter === 'reels' ? 'text-white border-b-2 border-white pb-2' : 'pb-2'">Reels</button>
          </div>

          <!-- Feed Items -->
          <div class="space-y-4 px-3">
            <template x-for="post in filteredPosts" :key="post.id">
              <div class="glass-card rounded-2xl p-4 space-y-3">
                <!-- User Header -->
                <div class="flex items-center justify-between">
                  <div class="flex items-center space-x-3">
                    <img :src="post.avatar" class="w-9 h-9 rounded-full object-cover border border-zinc-700" />
                    <div>
                      <h4 class="text-sm font-semibold text-zinc-100" x-text="post.author"></h4>
                      <p class="text-xs text-zinc-500" x-text="post.handle + ' • ' + post.time"></p>
                    </div>
                  </div>
                  <span class="text-xs px-2 py-0.5 rounded-full bg-zinc-800/80 text-zinc-400 border border-zinc-700/50 uppercase tracking-wider font-mono" x-text="post.type"></span>
                </div>

                <!-- Text / Threads Content -->
                <p class="text-sm text-zinc-200 leading-relaxed" x-text="post.content"></p>

                <!-- Media Content (Instagram / Reel Style) -->
                <template x-if="post.media">
                  <div class="relative rounded-xl overflow-hidden border border-zinc-800/80 bg-zinc-900">
                    <img :src="post.media" class="w-full h-64 object-cover" />
                    <template x-if="post.type === 'reel'">
                      <div class="absolute inset-0 flex items-center justify-center bg-black/30">
                        <i data-lucide="play-circle" class="w-12 h-12 text-white/90"></i>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- Action Buttons -->
                <div class="flex items-center justify-between pt-2 text-zinc-400 text-xs">
                  <div class="flex items-center space-x-4">
                    <button @click="toggleLike(post)" class="flex items-center space-x-1 hover:text-rose-500 transition">
                      <i data-lucide="heart" :class="post.liked ? 'text-rose-500 fill-rose-500 w-4 h-4' : 'w-4 h-4'"></i>
                      <span x-text="post.likes"></span>
                    </button>
                    <button class="flex items-center space-x-1 hover:text-zinc-200 transition">
                      <i data-lucide="message-circle" class="w-4 h-4"></i>
                      <span x-text="post.comments"></span>
                    </button>
                    <button class="flex items-center space-x-1 hover:text-zinc-200 transition">
                      <i data-lucide="repeat" class="w-4 h-4"></i>
                      <span x-text="post.reposts || 0"></span>
                    </button>
                  </div>
                  <i data-lucide="bookmark" class="w-4 h-4 hover:text-zinc-200"></i>
                </div>
              </div>
            </template>
          </div>

        </div>
      </template>

      <!-- ================= TIKTOK VERTICAL REELS VIEW ================= -->
      <template x-if="currentTab === 'reels_feed'">
        <div class="relative h-[calc(100vh-130px)] bg-zinc-900 rounded-2xl mx-3 overflow-hidden border border-zinc-800 flex items-end p-4">
          <img src="

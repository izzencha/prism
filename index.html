<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>prism</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      user-select: none;
    }

    /* Glassmorphic Styles */
    .glass-enabled .glass-bar {
      background: rgba(18, 18, 22, 0.75);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .glass-enabled .glass-card {
      background: rgba(24, 24, 27, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-disabled .glass-bar {
      background: #18181b;
      border: 1px solid #27272a;
    }
    .glass-disabled .glass-card {
      background: #18181b;
      border: 1px solid #27272a;
    }

    /* Interface Themes */
    .theme-nordic { background-color: #09090b; }
    .theme-midnight { background-color: #030712; }
    .theme-violet { background-color: #0f0716; }
    .theme-emerald { background-color: #022c22; }

    /* Progressive Blur Layer Gradients */
    .progressive-blur-top {
      position: sticky;
      top: 0;
      z-index: 30;
      height: 76px;
      margin-bottom: -76px;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(9,9,11,0.95) 0%, rgba(9,9,11,0.7) 40%, rgba(9,9,11,0) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
    }

    .progressive-blur-bottom {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 448px;
      z-index: 30;
      height: 90px;
      pointer-events: none;
      background: linear-gradient(to top, rgba(9,9,11,0.95) 0%, rgba(9,9,11,0.7) 40%, rgba(9,9,11,0) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      mask-image: linear-gradient(to top, black 50%, transparent 100%);
      -webkit-mask-image: linear-gradient(to top, black 50%, transparent 100%);
    }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body id="app-body" class="flex justify-center min-h-screen theme-nordic glass-enabled">

  <!-- Mobile Container Wrapper -->
  <div class="w-full max-w-md min-h-screen bg-zinc-950 flex flex-col justify-between relative shadow-2xl overflow-hidden border-x border-zinc-800/50">

    <!-- Progressive Blur Mask Layer (Top) -->
    <div class="progressive-blur-top"></div>

    <!-- TOP HEADER -->
    <header class="sticky top-2 z-40 mx-3 glass-bar rounded-2xl px-4 py-2.5 flex items-center justify-between shadow-xl">
      <div class="flex items-center space-x-2.5 cursor-pointer" onclick="switchTab('home')">
        <div class="w-7 h-7 bg-black rounded-lg flex items-center justify-center p-0.5 border border-zinc-800">
          <svg viewBox="0 0 100 100" class="w-full h-full fill-white">
            <circle cx="58" cy="42" r="38" />
            <rect x="12" y="54" width="36" height="36" />
          </svg>
        </div>
        <span class="text-lg font-extrabold tracking-tight text-white">prism</span>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="switchTab('settings')" class="p-2 rounded-xl hover:bg-zinc-800/60 transition active:scale-95">
          <i data-lucide="settings" class="w-5 h-5 text-zinc-200"></i>
        </button>
        <button onclick="switchTab('messenger')" class="relative p-2 rounded-xl hover:bg-zinc-800/60 transition active:scale-95">
          <i data-lucide="message-square" class="w-5 h-5 text-zinc-200"></i>
        </button>
      </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main id="main-content" class="flex-1 overflow-y-auto pt-3 pb-24 hide-scrollbar px-3">
      <!-- Dynamic Views Injected Here -->
    </main>

    <!-- Progressive Blur Mask Layer (Bottom) -->
    <div class="progressive-blur-bottom"></div>

    <!-- CREATE POST MODAL -->
    <div id="create-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end sm:items-center justify-center p-4">
      <div class="glass-card w-full max-w-sm rounded-2xl p-4 space-y-4 shadow-2xl">
        <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
          <h3 class="text-sm font-bold text-white">Create Post</h3>
          <button onclick="closeModal()" class="p-1 rounded-lg hover:bg-zinc-800 text-zinc-400"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <textarea id="post-content-input" placeholder="What's on your mind?" class="w-full h-24 bg-zinc-900/90 rounded-xl p-3 text-xs text-white placeholder-zinc-500 focus:outline-none border border-zinc-800 resize-none"></textarea>
        
        <!-- File Picker for Local Image Upload (No links needed!) -->
        <div class="space-y-1">
          <label class="block text-[11px] text-zinc-400">Upload Image / Media from Device</label>
          <input id="post-media-file" type="file" accept="image/*" class="w-full bg-zinc-900 text-xs text-zinc-300 rounded-xl p-2 border border-zinc-800 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-white file:text-black hover:file:bg-zinc-200 cursor-pointer" />
        </div>

        <div class="flex justify-between items-center pt-1">
          <select id="post-type-select" class="bg-zinc-900 text-xs text-zinc-300 rounded-xl p-2 border border-zinc-800 focus:outline-none">
            <option value="threads">Threads (Text)</option>
            <option value="photo">Instagram (Photo)</option>
            <option value="reel">TikTok (Reel)</option>
          </select>
          <button onclick="publishPost()" class="bg-white text-black font-bold text-xs px-5 py-2 rounded-xl active:scale-95 transition">Post</button>
        </div>
      </div>
    </div>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav id="bottom-nav" class="fixed bottom-3 left-1/2 -translate-x-1/2 w-[calc(100%-24px)] max-w-[424px] glass-bar rounded-2xl py-2.5 px-6 flex justify-between items-center z-40 shadow-xl">
      <button onclick="switchTab('home')" id="nav-home" class="nav-btn text-white active:scale-90 transition"><i data-lucide="home" class="w-5 h-5"></i></button>
      <button onclick="switchTab('reels')" id="nav-reels" class="nav-btn text-zinc-500 active:scale-90 transition"><i data-lucide="clapperboard" class="w-5 h-5"></i></button>
      <button onclick="openModal()" class="w-9 h-9 rounded-full bg-white text-black flex items-center justify-center shadow-lg active:scale-95 transition"><i data-lucide="plus" class="w-5 h-5"></i></button>
      <button onclick="switchTab('messenger')" id="nav-messenger" class="nav-btn text-zinc-500 active:scale-90 transition"><i data-lucide="send" class="w-5 h-5"></i></button>
      <button onclick="switchTab('profile')" id="nav-profile" class="nav-btn text-zinc-500 active:scale-90 transition"><i data-lucide="user" class="w-5 h-5"></i></button>
    </nav>

  </div>

  <script>
    let currentTab = 'home';
    let authStep = 'email';
    let authEmail = '';
    let authPassword = '';
    let feedFilter = 'all';
    let profileSubTab = 'posts';
    let activeChatId = null;

    let isGlassEnabled = JSON.parse(localStorage.getItem('prism_glass')) ?? true;
    let currentTheme = localStorage.getItem('prism_theme') || 'theme-nordic';

    let userAccount = JSON.parse(localStorage.getItem('prism_account')) || null;
    let userProfile = JSON.parse(localStorage.getItem('prism_user')) || null;

    // Blank Vector Avatar Generator
    function getBlankAvatarSVG() {
      return `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%2318181b"/><circle cx="50" cy="38" r="22" fill="%2352525b"/><path d="M15 88 C15 65, 85 65, 85 88" fill="%2352525b"/></svg>`;
    }

    const verifiedBadgeSVG = `
      <svg viewBox="0 0 100 100" class="w-4 h-4 inline-block ml-1">
        <circle cx="58" cy="42" r="38" fill="white" />
        <path d="M15 55 L38 78 L85 30" fill="none" stroke="#3b82f6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    `;

    function getCategoryBadge(category) {
      if (!category) return '';
      const badges = {
        business: { label: 'Business', color: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' },
        artist: { label: 'Artist', color: 'bg-purple-500/20 text-purple-400 border-purple-500/30' },
        singer: { label: 'Singer / Musician', color: 'bg-pink-500/20 text-pink-400 border-pink-500/30' },
        actor: { label: 'Actor / Performer', color: 'bg-amber-500/20 text-amber-400 border-amber-500/30' },
        creator: { label: 'Digital Creator', color: 'bg-blue-500/20 text-blue-400 border-blue-500/30' }
      };
      const b = badges[category] || badges.creator;
      return `<span class="text-[9px] font-semibold px-2 py-0.5 rounded-full border ${b.color} uppercase tracking-wider ml-1.5">${b.label}</span>`;
    }

    // Shared Server Mock Database
    let posts = JSON.parse(localStorage.getItem('prism_server_posts')) || [];
    let chatList = JSON.parse(localStorage.getItem('prism_server_chats')) || [];
    let registeredUsers = JSON.parse(localStorage.getItem('prism_server_users')) || [];

    // Reset corrupted follower cache if present
    if (userProfile && userProfile.followers > 1000) {
      userProfile.followers = 0;
      userProfile.following = 0;
      localStorage.setItem('prism_user', JSON.stringify(userProfile));
    }

    function applyPreferences() {
      const body = document.getElementById('app-body');
      body.className = `flex justify-center min-h-screen ${currentTheme} ${isGlassEnabled ? 'glass-enabled' : 'glass-disabled'}`;
      localStorage.setItem('prism_glass', JSON.stringify(isGlassEnabled));
      localStorage.setItem('prism_theme', currentTheme);
    }

    function saveServerState() {
      localStorage.setItem('prism_server_posts', JSON.stringify(posts));
      localStorage.setItem('prism_server_users', JSON.stringify(registeredUsers));
      localStorage.setItem('prism_server_chats', JSON.stringify(chatList));
      localStorage.setItem('prism_user', JSON.stringify(userProfile));
      localStorage.setItem('prism_account', JSON.stringify(userAccount));
    }

    function switchTab(tab) {
      if (!userAccount && tab !== 'auth') {
        currentTab = 'auth';
      } else {
        currentTab = tab;
      }
      activeChatId = null;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.className = 'nav-btn text-zinc-500 transition');
      const activeNav = document.getElementById('nav-' + currentTab);
      if (activeNav) activeNav.className = 'nav-btn text-white transition';
      render();
    }

    /* AUTHENTICATION & REGISTRATION */
    function handleEmailStep() {
      const email = document.getElementById('auth-email-input').value.trim();
      if (!email || !email.includes('@')) return alert('Please enter a valid email address');
      authEmail = email;
      authStep = 'password';
      render();
    }

    function handlePasswordStep() {
      const pass = document.getElementById('auth-pass-input').value.trim();
      if (pass.length < 6) return alert('Password must be at least 6 characters');
      authPassword = pass;
      authStep = 'setup';
      render();
    }

    function handleSetupStep() {
      const name = document.getElementById('setup-name-input').value.trim();
      const handle = document.getElementById('setup-handle-input').value.trim();
      const category = document.getElementById('setup-category-select').value;
      const bio = document.getElementById('setup-bio-input').value.trim();
      const avatarFileElem = document.getElementById('setup-avatar-file');

      if (!name || !handle) return alert('Please complete your name and handle');

      const finalizeSetup = (avatarData) => {
        userAccount = { email: authEmail, registeredAt: new Date().toLocaleDateString() };
        userProfile = {
          name: name,
          handle: handle.startsWith('@') ? handle : '@' + handle,
          category: category,
          avatar: avatarData || getBlankAvatarSVG(),
          bio: bio || 'Verified account on prism.',
          followers: 0,
          following: 0,
          verified: true,
          likedPostIds: [],
          savedPostIds: []
        };

        registeredUsers.push(userProfile);
        saveServerState();
        switchTab('home');
      };

      if (avatarFileElem.files && avatarFileElem.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) { finalizeSetup(e.target.result); };
        reader.readAsDataURL(avatarFileElem.files[0]);
      } else {
        finalizeSetup(getBlankAvatarSVG());
      }
    }

    function logoutAccount() {
      if (confirm('Are you sure you want to sign out?')) {
        userAccount = null;
        userProfile = null;
        authStep = 'email';
        localStorage.removeItem('prism_account');
        localStorage.removeItem('prism_user');
        render();
      }
    }

    function openModal() { document.getElementById('create-modal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('create-modal').classList.add('hidden'); }

    function publishPost() {
      const content = document.getElementById('post-content-input').value.trim();
      const type = document.getElementById('post-type-select').value;
      const fileInput = document.getElementById('post-media-file');
      if (!content) return;

      const createNewPostWithMedia = (mediaData) => {
        const newPost = {
          id: Date.now(),
          author: userProfile.name,
          handle: userProfile.handle,
          avatar: userProfile.avatar,
          category: userProfile.category,
          type: type,
          content: content,
          media: mediaData || null,
          time: 'Just now',
          likes: 0,
          comments: [],
          liked: false,
          verified: userProfile.verified
        };

        posts.unshift(newPost);
        saveServerState();
        document.getElementById('post-content-input').value = '';
        if(fileInput) fileInput.value = '';
        closeModal();
        switchTab('home');
      };

      if (fileInput && fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) { createNewPostWithMedia(e.target.result); };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        createNewPostWithMedia(null);
      }
    }

    function toggleLike(id) {
      const post = posts.find(p => p.id === id);
      if (post) {
        post.liked = !post.liked;
        post.likes += post.liked ? 1 : -1;
        
        if (post.liked) {
          if (!userProfile.likedPostIds.includes(id)) userProfile.likedPostIds.push(id);
        } else {
          userProfile.likedPostIds = userProfile.likedPostIds.filter(i => i !== id);
        }

        saveServerState();
        render();
      }
    }

    function toggleSave(id) {
      if (!userProfile.savedPostIds) userProfile.savedPostIds = [];
      if (userProfile.savedPostIds.includes(id)) {
        userProfile.savedPostIds = userProfile.savedPostIds.filter(i => i !== id);
      } else {
        userProfile.savedPostIds.push(id);
      }
      saveServerState();
      render();
    }

    function addComment(postId) {
      const input = document.getElementById(`comment-input-${postId}`);
      if (!input || !input.value.trim()) return;
      const post = posts.find(p => p.id === postId);
      if (post) {
        post.comments.push({ author: userProfile.name, text: input.value.trim() });
        saveServerState();
        render();
      }
    }

    /* RENDERING VIEWS */
    function renderAuth() {
      return `
        <div class="glass-card rounded-2xl p-6 text-center space-y-4 max-w-sm mx-auto mt-6">
          <div class="w-12 h-12 bg-black rounded-xl flex items-center justify-center mx-auto border border-zinc-800">
            <svg viewBox="0 0 100 100" class="w-8 h-8 fill-white"><circle cx="58" cy="42" r="38" /><rect x="12" y="54" width="36" height="36" /></svg>
          </div>
          <h2 class="text-xl font-bold text-white">Welcome to prism</h2>
          <p class="text-xs text-zinc-400">Connect to the shared social server with friends.</p>

          ${authStep === 'email' ? `
            <div class="space-y-3 text-left pt-2">
              <label class="block text-xs text-zinc-400">Email Address</label>
              <input id="auth-email-input" type="email" placeholder="name@domain.com" class="w-full bg-zinc-900 text-xs text-white rounded-xl p-3 border border-zinc-800 focus:outline-none" />
              <button onclick="handleEmailStep()" class="w-full bg-white text-black font-bold text-xs py-3 rounded-xl active:scale-95 transition">Continue</button>
            </div>
          ` : ''}

          ${authStep === 'password' ? `
            <div class="space-y-3 text-left pt-2">
              <label class="block text-xs text-zinc-400">Create Password</label>
              <input id="auth-pass-input" type="password" placeholder="••••••••" class="w-full bg-zinc-900 text-xs text-white rounded-xl p-3 border border-zinc-800 focus:outline-none" />
              <button onclick="handlePasswordStep()" class="w-full bg-white text-black font-bold text-xs py-3 rounded-xl active:scale-95 transition">Set Password</button>
            </div>
          ` : ''}

          ${authStep === 'setup' ? `
            <div class="space-y-3 text-left pt-2">
              <div><label class="block text-xs text-zinc-400 mb-1">Display Name</label><input id="setup-name-input" type="text" placeholder="Your Name or Brand" class="w-full bg-zinc-900 text-xs text-white rounded-xl p-2.5 border border-zinc-800 focus:outline-none" /></div>
              <div><label class="block text-xs text-zinc-400 mb-1">Username Handle</label><input id="setup-handle-input" type="text" placeholder="@handle" class="w-full bg-zinc-900 text-xs text-white rounded-xl p-2.5 border border-zinc-800 focus:outline-none" /></div>
              
              <!-- Local Image File Picker for PFP -->
              <div class="space-y-1">
                <label class="block text-xs text-zinc-400">Profile Picture (Upload from Device)</label>
                <input id="setup-avatar-file" type="file" accept="image/*" class="w-full bg-zinc-900 text-xs text-zinc-300 rounded-xl p-2 border border-zinc-800 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-white file:text-black hover:file:bg-zinc-200 cursor-pointer" />
              </div>
              
              <div>
                <label class="block text-xs text-zinc-400 mb-1">Account Category / Recognition</label>
                <select id="setup-category-select" class="w-full bg-zinc-900 text-xs text-white rounded-xl p-2.5 border border-zinc-800 focus:outline-none">
                  <option value="business">🏢 Official Business / Brand</option>
                  <option value="artist">🎨 Artist / Visual Designer</option>
                  <option value="singer">🎤 Singer / Musician</option>
                  <option value="actor">🎬 Actor / Performer</option>
                  <option value="creator">✨ Digital Creator</option>
                </select>
              </div>

              <div><label class="block text-xs text-zinc-400 mb-1">Bio</label><textarea id="setup-bio-input" placeholder="Bio..." class="w-full h-16 bg-zinc-900 text-xs text-white rounded-xl p-2.5 border border-zinc-800 focus:outline-none resize-none"></textarea></div>
              <button onclick="handleSetupStep()" class="w-full bg-white text-black font-bold text-xs py-3 rounded-xl active:scale-95 transition">Join Server</button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderSettings() {
      return `
        <div class="space-y-4">
          <div class="glass-card rounded-2xl p-4 space-y-4">
            <h3 class="text-sm font-bold text-white border-b border-zinc-800 pb-2">Prism Settings & Hub</h3>
            
            <!-- Category Badge Update -->
            <div class="space-y-2">
              <label class="block text-xs font-semibold text-zinc-200">Account Recognition Badge</label>
              <select onchange="userProfile.category = this.value; saveServerState(); render();" class="w-full bg-zinc-900 text-xs text-white rounded-xl p-2.5 border border-zinc-800 focus:outline-none">
                <option value="business" ${userProfile.category === 'business' ? 'selected' : ''}>🏢 Official Business / Brand</option>
                <option value="artist" ${userProfile.category === 'artist' ? 'selected' : ''}>🎨 Artist / Visual Designer</option>
                <option value="singer" ${userProfile.category === 'singer' ? 'selected' : ''}>🎤 Singer / Musician</option>
                <option value="actor" ${userProfile.category === 'actor' ? 'selected' : ''}>🎬 Actor / Performer</option>
                <option value="creator" ${userProfile.category === 'creator' ? 'selected' : ''}>✨ Digital Creator</option>
              </select>
            </div>

            <!-- Upload New PFP File -->
            <div class="space-y-1">
              <label class="block text-xs font-semibold text-zinc-200">Update Profile Picture (From Device)</label>
              <input id="settings-avatar-file" type="file" accept="image/*" onchange="
                const f = this.files[0];
                if(f) {
                  const r = new FileReader();
                  r.onload = function(e) {
                    userProfile.avatar = e.target.result;
                    saveServerState();
                    render();
                  };
                  r.readAsDataURL(f);
                }
              " class="w-full bg-zinc-900 text-xs text-zinc-300 rounded-xl p-2 border border-zinc-800 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-white file:text-black hover:file:bg-zinc-200 cursor-pointer" />
            </div>

            <!-- Glassmorphism Toggle -->
            <div class="flex items-center justify-between py-1 border-t border-zinc-800/60 pt-3">
              <div>
                <h4 class="text-xs font-semibold text-zinc-200">Liquid Glass Effects</h4>
                <p class="text-[10px] text-zinc-500">Enable blur backdrop glassmorphism UI</p>
              </div>
              <button onclick="isGlassEnabled = !isGlassEnabled; applyPreferences(); render();" class="w-11 h-6 rounded-full transition p-0.5 ${isGlassEnabled ? 'bg-white' : 'bg-zinc-800'}">
                <div class="w-5 h-5 rounded-full transition ${isGlassEnabled ? 'bg-black translate-x-5' : 'bg-zinc-400'}"></div>
              </button>
            </div>

            <!-- Interface Themes -->
            <div class="space-y-2 pt-2 border-t border-zinc-800/60">
              <h4 class="text-xs font-semibold text-zinc-200">Interface Themes</h4>
              <div class="grid grid-cols-2 gap-2 text-xs">
                <button onclick="currentTheme='theme-nordic'; applyPreferences();" class="p-2.5 rounded-xl border border-zinc-700 bg-zinc-900 text-zinc-200 text-left">Dark Nordic</button>
                <button onclick="currentTheme='theme-midnight'; applyPreferences();" class="p-2.5 rounded-xl border border-sky-900 bg-gray-950 text-sky-400 text-left">Midnight Blue</button>
                <button onclick="currentTheme='theme-violet'; applyPreferences();" class="p-2.5 rounded-xl border border-purple-900 bg-purple-950 text-purple-400 text-left">Sunset Violet</button>
                <button onclick="currentTheme='theme-emerald'; applyPreferences();" class="p-2.5 rounded-xl border border-emerald-900 bg-emerald-950 text-emerald-400 text-left">Emerald Obsidian</button>
              </div>
            </div>

            <!-- Server Sync Info -->
            <div class="pt-2 border-t border-zinc-800/60 space-y-2 text-xs text-zinc-400">
              <h4 class="text-xs font-semibold text-zinc-200">Shared Server Info</h4>
              <p>Connected server node: <span class="text-emerald-400 font-mono">prism-global-relay</span></p>
              <p>Total Server Registered Users: <span class="text-white font-mono">${registeredUsers.length}</span></p>
              <button onclick="localStorage.clear(); location.reload();" class="w-full bg-zinc-800 text-zinc-300 font-semibold py-2 rounded-xl hover:bg-zinc-700 transition mt-2">Reset Local Node Cache</button>
            </div>

            <div class="pt-2 border-t border-zinc-800/60 space-y-2">
              <button onclick="logoutAccount()" class="w-full bg-rose-950/60 text-rose-400 border border-rose-900 text-xs font-semibold py-2.5 rounded-xl hover:bg-rose-900/60 transition">Sign Out Account</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderFeed() {
      let filtered = posts;
      if (feedFilter === 'threads') filtered = posts.filter(p => p.type === 'threads');
      if (feedFilter === 'reels') filtered = posts.filter(p => p.type === 'reel' || p.type === 'photo');

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-around pb-2 border-b border-zinc-800/60 text-xs font-semibold text-zinc-400">
            <button onclick="feedFilter='all'; render();" class="${feedFilter === 'all' ? 'text-white border-b-2 border-white pb-1' : 'pb-1'}">For You</button>
            <button onclick="feedFilter='threads'; render();" class="${feedFilter === 'threads' ? 'text-white border-b-2 border-white pb-1' : 'pb-1'}">Threads</button>
            <button onclick="feedFilter='reels'; render();" class="${feedFilter === 'reels' ? 'text-white border-b-2 border-white pb-1' : 'pb-1'}">Reels</button>
          </div>
          <div class="space-y-3">
            ${filtered.length === 0 ? `
              <div class="text-center py-12 text-zinc-500 text-xs">
                No server posts yet. Tap the plus (+) button below to publish to the network!
              </div>
            ` : filtered.map(post => `
              <div class="glass-card rounded-2xl p-4 space-y-3">
                <div class="flex items-center justify-between">
                  <div class="flex items-center space-x-3">
                    <img src="${post.avatar}" class="w-9 h-9 rounded-full object-cover border border-zinc-700" />
                    <div>
                      <div class="flex items-center space-x-1 flex-wrap">
                        <h4 class="text-sm font-semibold text-zinc-100">${post.author}</h4>
                        ${post.verified ? verifiedBadgeSVG : ''}
                        ${getCategoryBadge(post.category)}
                      </div>
                      <p class="text-xs text-zinc-500">${post.handle} • ${post.time}</p>
                    </div>
                  </div>
                  <span class="text-[10px] px-2 py-0.5 rounded-full bg-zinc-800 text-zinc-400 border border-zinc-700/50 uppercase font-mono tracking-wider">${post.type}</span>
                </div>
                <p class="text-sm text-zinc-200 leading-relaxed">${post.content}</p>
                ${post.media ? `<div class="relative rounded-xl overflow-hidden border border-zinc-800 bg-zinc-900"><img src="${post.media}" class="w-full h-60 object-cover" /></div>` : ''}
                <div class="flex items-center justify-between pt-2 text-zinc-400 text-xs border-b border-zinc-800/40 pb-2">
                  <div class="flex items-center space-x-4">
                    <button onclick="toggleLike(${post.id})" class="flex items-center space-x-1 hover:text-rose-500 transition">
                      <i data-lucide="heart" class="w-4 h-4 ${post.liked ? 'text-rose-500 fill-rose-500' : ''}"></i>
                      <span>${post.likes}</span>
                    </button>
                    <div class="flex items-center space-x-1"><i data-lucide="message-circle" class="w-4 h-4"></i><span>${post.comments.length}</span></div>
                  </div>
                  <button onclick="toggleSave(${post.id})" class="hover:text-white transition">
                    <i data-lucide="bookmark" class="w-4 h-4 ${userProfile.savedPostIds && userProfile.savedPostIds.includes(post.id) ? 'text-white fill-white' : ''}"></i>
                  </button>
                </div>
                <div class="space-y-2 pt-1">
                  ${post.comments.map(c => `<div class="text-xs bg-zinc-900/50 rounded-lg p-2"><span class="font-bold text-zinc-200">${c.author}:</span><span class="text-zinc-400 ml-1">${c.text}</span></div>`).join('')}
                  <div class="flex space-x-2 pt-1">
                    <input id="comment-input-${post.id}" type="text" placeholder="Write a comment..." class="flex-1 bg-zinc-900 text-xs text-white rounded-xl px-3 py-1.5 border border-zinc-800 focus:outline-none" />
                    <button onclick="addComment(${post.id})" class="bg-zinc-800 text-xs text-white px-3 py-1.5 rounded-xl font-semibold">Reply</button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderReels() {
      const reelPosts = posts.filter(p => p.type === 'reel' || p.type === 'photo');
      if (reelPosts.length === 0) {
        return `<div class="text-center py-20 text-zinc-500 text-xs">No Reels or Photos available on the network yet.</div>`;
      }
      const p = reelPosts[0];
      return `
        <div class="relative h-[calc(100vh-170px)] bg-zinc-900 rounded-2xl overflow-hidden border border-zinc-800 flex items-end p-4">
          <img src="${p.media || 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800'}" class="absolute inset-0 w-full h-full object-cover" />
          <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
          <div class="relative z-10 w-full flex justify-between items-end">
            <div class="space-y-2 max-w-[80%]">
              <div class="flex items-center space-x-2">
                <img src="${p.avatar}" class="w-8 h-8 rounded-full border border-white object-cover" />
                <span class="text-sm font-bold text-white flex items-center">${p.handle} ${verifiedBadgeSVG} ${getCategoryBadge(p.category)}</span>
              </div>
              <p class="text-xs text-zinc-200">${p.content}</p>
            </div>
            <div class="flex flex-col items-center space-y-4 text-white">
              <button onclick="toggleLike(${p.id})" class="flex flex-col items-center"><i data-lucide="heart" class="w-6 h-6 ${p.liked ? 'text-rose-500 fill-rose-500' : ''}"></i><span class="text-[10px] mt-1">${p.likes}</span></button>
            </div>
          </div>
        </div>
      `;
    }

    function renderMessenger() {
      return `
        <div class="space-y-3">
          <h2 class="text-base font-bold text-white px-1">Network Direct Messages</h2>
          <div class="text-center py-16 text-zinc-500 text-xs">
            Server messenger relay active. Connect with registered friends on the network.
          </div>
        </div>
      `;
    }

    function renderProfile() {
      if (!userProfile) return '';
      const myPosts = posts.filter(p => p.handle === userProfile.handle);
      const likedPosts = posts.filter(p => userProfile.likedPostIds && userProfile.likedPostIds.includes(p.id));
      const savedPosts = posts.filter(p => userProfile.savedPostIds && userProfile.savedPostIds.includes(p.id));

      let activeList = myPosts;
      if (profileSubTab === 'liked') activeList = likedPosts;
      if (profileSubTab === 'saved') activeList = savedPosts;

      return `
        <div class="space-y-4">
          <div class="glass-card rounded-2xl p-4 text-center space-y-3">
            <img src="${userProfile.avatar}" class="w-20 h-20 rounded-full mx-auto object-cover border-2 border-white/20 shadow-md" />
            <div>
              <div class="flex items-center justify-center space-x-1 flex-wrap">
                <h3 class="text-base font-bold text-white">${userProfile.name}</h3>
                ${userProfile.verified ? verifiedBadgeSVG : ''}
              </div>
              <div class="mt-1">${getCategoryBadge(userProfile.category)}</div>
              <p class="text-xs text-zinc-400 mt-1">${userProfile.handle}</p>
            </div>
            <p class="text-xs text-zinc-300 leading-relaxed">${userProfile.bio}</p>
            
            <!-- Followers & Following now cleanly display organic numbers (0 for new users) -->
            <div class="flex justify-center space-x-6 py-2 border-t border-b border-zinc-800/60 text-xs">
              <div><strong class="block text-white text-sm">${myPosts.length}</strong><span class="text-zinc-500">Posts</span></div>
              <div><strong class="block text-white text-sm">${userProfile.followers}</strong><span class="text-zinc-500">Followers</span></div>
              <div><strong class="block text-white text-sm">${userProfile.following}</strong><span class="text-zinc-500">Following</span></div>
            </div>
          </div>

          <!-- Profile Navigation Tabs (Recent Posts, Liked, Favorites) -->
          <div class="flex items-center justify-around pb-2 border-b border-zinc-800/60 text-xs font-semibold text-zinc-400">
            <button onclick="profileSubTab='posts'; render();" class="${profileSubTab === 'posts' ? 'text-white border-b-2 border-white pb-1' : 'pb-1'}">Recent Posts</button>
            <button onclick="profileSubTab='liked'; render();" class="${profileSubTab === 'liked' ? 'text-white border-b-2 border-white pb-1' : 'pb-1'}">Liked</button>
            <button onclick="profileSubTab='saved'; render();" class="${profileSubTab === 'saved' ? 'text-white border-b-2 border-white pb-1' : 'pb-1'}">Favorites</button>
          </div>
          
          <div class="space-y-2">
            ${activeList.length === 0 ? `<p class="text-xs text-zinc-500 px-1 text-center py-6">No items found in this section.</p>` : activeList.map(p => `
              <div class="glass-card rounded-xl p-3 text-xs text-zinc-200 space-y-1">
                <div class="flex justify-between text-zinc-500 text-[10px]"><span>${p.type}</span><span>${p.time}</span></div>
                <p class="font-medium text-white">${p.author}</p>
                <p>${p.content}</p>
                ${p.media ? `<img src="${p.media}" class="w-full h-36 object-cover rounded-lg mt-2" />` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function render() {
      applyPreferences();
      const container = document.getElementById('main-content');
      const nav = document.getElementById('bottom-nav');

      if (!userAccount) {
        nav.classList.add('hidden');
        container.innerHTML = renderAuth();
      } else {
        nav.classList.remove('hidden');
        if (currentTab === 'home') container.innerHTML = renderFeed();
        else if (currentTab === 'reels') container.innerHTML = renderReels();
        else if (currentTab === 'messenger') container.innerHTML = renderMessenger();
        else if (currentTab === 'profile') container.innerHTML = renderProfile();
        else if (currentTab === 'settings') container.innerHTML = renderSettings();
      }

      lucide.createIcons();
    }

    render();
  </script>
</body>
</html>
